# Permite scripts postinstall de dependencias nativas (pnpm v10.26+ / v11).
# Permite instalar esas dependencias en Cloudflare y GitHub Actions.
allowBuilds:
  "@biomejs/biome": true
  better-sqlite3: true
  core-js: true
  esbuild: true
  protobufjs: true
  sharp: true
  workerd: true
minimumReleaseAgeExclude:
  - '@tinacms/cli@4.0.4'
  - '@tinacms/graphql@4.1.0'
  - '@tinacms/mdx@2.4.1'
