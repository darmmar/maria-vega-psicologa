name: Publicar a Producción (dev -> main)

on:
  repository_dispatch:
    types: [publish-to-production]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  merge-dev-to-main:
    name: Fusionar dev en main
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio (main)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar identidad de Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Obtener rama dev y fusionar en main
        run: |
          git fetch origin dev:dev
          git checkout main
          git merge --no-ff dev -m "chore(release): publicar cambios de dev a main desde TinaCMS" || {
            echo "::error::Error de conflicto al fusionar la rama dev en main. Resuelve los conflictos en Git manualmente."
            exit 1
          }
          git push origin main
