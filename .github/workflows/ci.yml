name: CI

on:
  push:
    branches: [main, dev, feat/**]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    env:
      PUBLIC_SITE_URL: https://mariavegagarcia.es
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 11.3.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Tina client and verify schema lock
        run: |
          pnpm exec tinacms build --local --skip-indexing --skip-cloud-checks --skip-search-index --no-client-build-cache
          if ! git diff --quiet -- tina/tina-lock.json; then
            echo "::error::tina/tina-lock.json is stale. Run pnpm tina:sync and commit the lock."
            exit 1
          fi

      - name: TypeScript check
        run: pnpm typecheck

      - name: Build
        run: pnpm build:astro

      - name: Install browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Verify visual editing
        run: pnpm test:editor

      - name: Upload browser diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: editor-browser-diagnostics
          path: test-results/
          retention-days: 3

      - name: Check for secrets in diff
        run: |
          if git diff --name-only origin/main...HEAD | xargs grep -l -E "(sk_live|pk_live|AIza|AKIA|password\s*=\s*['\"][^'\"]{8,})" 2>/dev/null; then
            echo "::error::Possible secrets detected in changed files"
            exit 1
          fi
        continue-on-error: false
