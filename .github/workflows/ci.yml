name: CI

on:
  push:
    branches: [main, feat/**]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Biome check (lint + format)
        run: pnpm check

      - name: TypeScript check
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Check for secrets in diff
        run: |
          if git diff --name-only origin/main...HEAD | xargs grep -l -E "(sk_live|pk_live|AIza|AKIA|password\s*=\s*['\"][^'\"]{8,})" 2>/dev/null; then
            echo "::error::Possible secrets detected in changed files"
            exit 1
          fi
        continue-on-error: false
